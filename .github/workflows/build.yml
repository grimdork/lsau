name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Build debug binary
        run: make debug

      - name: Verify CLI help
        run: ./build/lsau -h

      - name: Verify debug CLI help
        run: ./build/lsau-debug -h

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsau-macos
          path: |
            build/lsau
            build/lsau-debug
          if-no-files-found: error
