name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Verify CLI help
        run: ./build/lsau -h

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsau-macos
          path: build/lsau
          if-no-files-found: error
